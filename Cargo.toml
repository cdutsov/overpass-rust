[package]
name = "overpass"
version = "0.2.2"
edition = "2024"
rust-version = "1.86"
description = "Rust reimplementation of the Overpass API (OpenStreetMap query server)"
license = "AGPL-3.0-or-later"

[[bin]]
name = "overpass"
path = "src/bin/overpass.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bzip2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
form_urlencoded = "1"
futures-core = "0.3"
heed = { version = "0.21", features = ["read-txn-no-tls"] }
lz4_flex = "0.11"
memmap2 = "0.9"
osmpbf = "0.3"
quick-xml = "0.37"
rayon = "1"
rustc-hash = "2"
mimalloc = { version = "0.1", default-features = false }
regex = "1"
regex-syntax = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
ureq = "2"

[dev-dependencies]
roxmltree = "0.20"
serde_json = "1"

[profile.release]
debug = 1
lto = "thin"
# One unit: with several, the split moves with unrelated code changes and
# small functions stop being inlined into their callers (Tags::with_capacity
# into the node and way decoding: 1-7% slower queries).
codegen-units = 1
